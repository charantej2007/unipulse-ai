<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6e6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Graduation cap -->
  <polygon points="50,15 10,35 50,55 90,35" fill="url(#grad)"/>
  <polygon points="50,55 10,35 10,45 50,65 90,45 90,35" fill="url(#grad)" opacity="0.8"/>
  <rect x="48" y="55" width="4" height="20" fill="url(#grad)"/>
  <circle cx="50" cy="78" r="5" fill="url(#grad)"/>
  <!-- Arrow indicating growth -->
  <path d="M70,75 L70,50 L60,60 M70,50 L80,60" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
